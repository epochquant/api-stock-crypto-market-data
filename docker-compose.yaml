services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-stock-crypto-market-data:local
    container_name: api-stock-crypto-market-data
    ports:
      - "8010:${BACKEND_PORT:-8010}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BACKEND_PORT:-3000}/api/docs/json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
